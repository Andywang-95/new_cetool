name: Build and Create Installer (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pandas openpyxl flask pywebview[cef] screeninfo tabulate

      - name: Build with PyInstaller
        run: |
          pyinstaller run_win.spec

      # Note: no zip step — Inno Setup will package dist\run directly.

      # - name: Install Inno Setup (Chocolatey)
      #   shell: powershell
      #   run: |
      #     choco install innosetup -y
      #     # ensure Inno path available
      #     $env:Path += ";C:\\Program Files (x86)\\Inno Setup 6"
      #     iscc /VER

      # - name: Create installer (Inno)
      #   shell: powershell
      #   run: |
      #     $ver = '${{ github.ref_name }}'
      #     if ([string]::IsNullOrEmpty($ver)) { $ver = 'dev' }
      #     Write-Host "Building installer version: $ver"
      #     # call Inno Setup Compiler with a defined preprocessor variable MyAppVersion
      #     iscc /DMyAppVersion=$ver .\installer\CE_Tool_installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ce-tool
          path: |
            dist\run\**\*
            Output\CE_Tool_Installer_*.exe

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            CE Tool release ${{ github.ref_name }}

            Download the installer from the assets below.
          files: |
            Output\CE_Tool_Installer_*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
