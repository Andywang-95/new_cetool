name: Build and Create Installer (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Visual C++ Redistributable (required for pythonnet)
        shell: powershell
        run: |
          # Install Visual C++ redistributable needed by pythonnet
          choco install visualcpp-build-tools -y --force --no-progress
          Write-Host "Visual C++ redistributable installed"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pandas openpyxl flask pywebview screeninfo tabulate pythonnet==3.0.5

      - name: Build with PyInstaller
        run: |
          pyinstaller run_win.spec

      - name: List dist contents (debug)
        if: always()
        shell: powershell
        run: |
          Write-Host "=== dist\\ce_tool contents ==="
          if (Test-Path 'dist\\ce_tool') {
            Get-ChildItem -Recurse -Force -File dist\ce_tool | Select-Object FullName
          } else {
            Write-Host 'dist\\ce_tool not found'
          }

      # Note: no zip step — Inno Setup will package dist\run directly.

      - name: Install Inno Setup (Chocolatey)
        shell: powershell
        run: |
          choco install innosetup -y --force
          # ensure Inno path available
          $env:Path += ';C:\\Program Files (x86)\\Inno Setup 6'
          # verify iscc exists
          $innoPath = 'C:\\Program Files (x86)\\Inno Setup 6\\iscc.exe'
          if (Test-Path $innoPath) {
            Write-Host '✓ Inno Setup installed successfully'
          } else {
            Write-Error 'Inno Setup iscc.exe not found'
            exit 1
          }

      - name: Create installer (Inno)
        shell: powershell
        run: |
          $ver = '${{ github.ref_name }}'
          if ([string]::IsNullOrEmpty($ver)) { $ver = 'dev' }
          Write-Host "Building installer version: $ver"
          # call Inno Setup Compiler with a defined preprocessor variable MyAppVersion
          iscc /DMyAppVersion=$ver .\installer\CE_Tool_installer.iss

      - name: List Output contents (debug)
        if: always()
        shell: powershell
        run: |
          Write-Host "=== Output contents ==="
          if (Test-Path 'Output') {
            Get-ChildItem -Recurse -Force -File Output | Select-Object FullName
          } else {
            Write-Host 'Output not found'
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ce-tool
          path: |
            dist\ce_tool\**\*
            Output\CE_Tool_Installer_*.exe

      # Note: publishing dev releases from workflow_dispatch was removed.
      # Use the tag-triggered release (on push tags v*.*.*) for official releases.

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            CE Tool release ${{ github.ref_name }}

            Download the installer from the assets below.
          files: |
            Output\CE_Tool_Installer_*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
