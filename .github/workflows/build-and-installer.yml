name: Build and Create Installer (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ 關鍵：固定 Python 3.10 x64
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install pythonnet==3.0.3 --only-binary=:all:
          pip install pandas openpyxl flask pywebview screeninfo tabulate

      # ✅ PyInstaller
      - name: Build with PyInstaller
        run: |
          pyinstaller run_win.spec

      # ✅ 關鍵：直接驗證 pythonnet runtime export
      - name: Verify pythonnet runtime export
        shell: powershell
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class Check {
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern IntPtr LoadLibrary(string lpFileName);
              [DllImport("kernel32.dll")]
              static extern IntPtr GetProcAddress(IntPtr hModule, string procName);
              public static void Run(string dll) {
                  var h = LoadLibrary(dll);
                  if (h == IntPtr.Zero) {
                      throw new Exception("LoadLibrary failed");
                  }
                  if (GetProcAddress(h, "Python.Runtime.Loader.Initialize") == IntPtr.Zero) {
                      throw new Exception("Export Python.Runtime.Loader.Initialize missing");
                  }
                  Console.WriteLine("✓ Python.Runtime.Loader.Initialize export found");
              }
          }
          "@
          [Check]::Run("dist\ce_tool\_internal\pythonnet\runtime\Python.Runtime.dll")

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --force
          $env:Path += ';C:\Program Files (x86)\Inno Setup 6'

      - name: Create installer (Inno)
        shell: powershell
        run: |
          $ver = '${{ github.ref_name }}'
          if ([string]::IsNullOrEmpty($ver)) { $ver = 'dev' }
          iscc /DMyAppVersion=$ver .\installer\CE_Tool_installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ce-tool
          path: |
            dist\ce_tool\**\*
            Output\CE_Tool_Installer_*.exe

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            CE Tool release ${{ github.ref_name }}

            Download the installer from the assets below.
          files: |
            Output\CE_Tool_Installer_*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
