[project]
name = "ce-tool"
version = "0.1.0"
description = "CE BOM Tool - Flask-based desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "pywebview>=5.4",
    "pywebview-cef>=5.4",
    "screeninfo>=0.8.1",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
]
